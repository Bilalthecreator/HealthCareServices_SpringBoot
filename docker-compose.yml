version: '3.8'

services:
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"

  healthcare:
    build: ./healthcare
    container_name: healthcare
    ports:
      - "8080:8080"
    environment:
      - order.service.url=http://order-service:8081
    depends_on:
      - order-service